server:
  port: 8083
spring:
  application:
    name: reputacao-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reputacao_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - contratoId=%X{contratoId} eventId=%X{eventId} correlationId=%X{correlationId} %msg%n"
  level:
    root: INFO
    br.com.freela: INFO
    io.micrometer.tracing: DEBUG
    io.zipkin.reporter2: DEBUG